<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewer-data" content="viewer-data.json">
<title>T-Studio 매매 보고서 뷰어</title>
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --gain:#e34948;--loss:#2a78d6;--gain-text:#b83432;--loss-text:#1c5cab;--accent:#2a78d6;--wash:rgba(11,11,11,.05);
  --lane1:#2a78d6;--lane2:#eb6834;--lane3:#1baf7a;--lane4:#eda100;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
    --gain:#e66767;--loss:#3987e5;--gain-text:#e66767;--loss-text:#5598e7;--accent:#3987e5;--wash:rgba(255,255,255,.06);
    --lane1:#3987e5;--lane2:#d95926;--lane3:#199e70;--lane4:#c98500;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --gain:#e66767;--loss:#3987e5;--gain-text:#e66767;--loss-text:#5598e7;--accent:#3987e5;--wash:rgba(255,255,255,.06);
  --lane1:#3987e5;--lane2:#d95926;--lane3:#199e70;--lane4:#c98500;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
body{padding:16px;max-width:1180px;margin:0 auto}
h1{font-size:18px;margin:0;font-weight:700}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
h3{font-size:13px;margin:0 0 6px;font-weight:700;color:var(--ink2)}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.top .meta{color:var(--muted);font-size:12px}
.top>*{min-width:0;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;max-width:100%}
select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 9px;max-width:100%}
.seg{flex-wrap:wrap}
button{cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:transparent}
button:hover:not(.on){background:var(--wash)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.tile .v .txt{font-size:14px;font-weight:600;display:block;margin-top:6px}
.tile .s{font-size:12px;color:var(--ink2);margin-top:2px}
.gain{color:var(--gain-text)}.loss{color:var(--loss-text)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--muted);font-weight:600;text-align:left;white-space:nowrap;font-size:12px}
th.num{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--wash)}
tr.sel td{background:var(--wash);box-shadow:inset 3px 0 var(--accent)}
.tw{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:4px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lane{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--wash);font-size:12px;margin-right:4px}
.links a{margin-right:12px;color:var(--accent)}
.warn{font-size:12px;color:var(--ink2);border-left:3px solid var(--lane4);padding:4px 8px;margin:4px 0;background:var(--wash)}
.small{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.tcard{display:grid;grid-template-columns:minmax(230px,1fr) minmax(280px,1.5fr);gap:6px 14px;padding:10px 0;border-bottom:1px solid var(--grid);align-items:start}
.tcard:last-child{border-bottom:0}
.tinfo{font-size:13px;line-height:1.45}
.tinfo .row{display:flex;gap:10px;flex-wrap:wrap}
.tinfo .k{color:var(--muted);min-width:64px;display:inline-block}
.tinfo .big{font-size:16px;font-weight:700}
@media (max-width:760px){.tcard{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div><h1>T-Studio 매매 보고서 뷰어</h1><div class="meta" id="meta">생성 (서버 자료) · 뷰어 형식 v1 · 내부용 · 집계본만 읽는다(원본을 다시 읽지 않는다)</div></div>
  <div class="bar" id="controls" style="margin:0">
    <select id="scope"></select>
    <span class="seg" id="range"></span>
    <span class="seg" id="tab"></span>
    <label class="small" title="하루에 굴리는 돈(일일매수금액한도). 순손익을 이 금액으로 나눈 수익률을 보여준다. 사용자마다 따로 기억한다">운영자금(사용자별) <input id="capital" type="text" inputmode="numeric" style="width:110px;text-align:right;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 7px"> 원 <span id="capmsg" class="small"></span></label>
  </div>
</div>
<div id="tiles" class="tiles"></div>
<div id="main"></div>
<div id="day"></div>
<script id="data" type="application/json"></script>
<script>
function boot(DATA, chartLoader, capitals){
const LANE_ORDER = DATA.laneOrder, LANE_LABEL = DATA.laneLabel;
const LANE_COLOR = {MULTI_DAY_OVERSOLD:'var(--lane1)',VOLUME_SURGE_REBOUND:'var(--lane2)',DEEP_DROP_REBOUND:'var(--lane3)',REVERSAL_RECOVERY:'var(--lane4)'};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = v => v==null ? '—' : (v>0?'+':v<0?'−':'') + Math.abs(Math.round(v)).toLocaleString('ko-KR') + '원';
const wonPlain = v => v==null ? '—' : Math.round(v).toLocaleString('ko-KR') + '원';
const pct = (v,d=2) => v==null ? '—' : (v>0?'+':v<0?'−':'') + Math.abs(v).toFixed(d) + '%';
const pctPlain = (v,d=1) => v==null ? '—' : v.toFixed(d) + '%';
const n = v => v==null ? '—' : Number(v).toLocaleString('ko-KR');
const cls = v => v>0?'gain':v<0?'loss':'';
const hold = s => s==null?'—': s>=3600? Math.floor(s/3600)+'시간 '+Math.floor(s%3600/60)+'분' : Math.floor(s/60)+'분 '+(s%60)+'초';
const ymd = d => d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
const md = d => d.slice(4,6)+'-'+d.slice(6,8);
const dow = d => ['일','월','화','수','목','금','토'][new Date(ymd(d)).getDay()];
// 주 = 월~금. 키는 그 주 월요일(yyyy-mm-dd). 휴장일은 집계본이 없으니 저절로 빠지고 남은 거래일만 그 주로 묶인다.
function isoWeekKey(d){ const dt=new Date(ymd(d)+'T00:00:00'); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function weekRange(key){ const a=new Date(key+'T00:00:00'); const b=new Date(a); b.setDate(a.getDate()+4); const f=x=>String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); return f(a)+'~'+f(b); }
// 운영자금 — 하루에 굴리는 돈(일일매수금액한도). 순손익을 이것으로 나눈 것이 «운영자금 대비 %», 그날 실제 매수금 합으로 나눈 것이 «매수금 대비 %».
// ⚑ 사용자마다 다르다(2026-09-16) — 사람별로 기억한다. 기본 15,000,000원.
// 웹 판은 서버에 둔다(2026-09-16 저녁 · 사용자 결정): capitals={map:{사람:원}, save:(원)=>Promise} — 자기 것(«나»)만 고칠 수 있고 남의 값은 그 사람이 정한 값 그대로다.
const CAPITAL_KEY='tstudio-viewer-capital-map';
const SERVER_CAPS = capitals ? (capitals.map||{}) : null;
const CAP_MAP = (()=>{ if(SERVER_CAPS) return {}; try{ const m=JSON.parse(localStorage.getItem(CAPITAL_KEY)||'{}'); return (m&&typeof m==='object')?m:{}; }catch(e){ return {}; } })();
function capitalOf(person){ const v=Number(SERVER_CAPS ? SERVER_CAPS[person] : CAP_MAP[person]); return v>0?v:15000000; }
function setCapital(person,v){
  if(SERVER_CAPS){ if(person!=='나') return Promise.resolve(); SERVER_CAPS[person]=v; return capitals.save(v); }
  CAP_MAP[person]=v; try{ localStorage.setItem(CAPITAL_KEY, JSON.stringify(CAP_MAP)); }catch(e){} return Promise.resolve();
}
let CAPITAL = 15000000;   // render()가 고른 묶음의 사람 값으로 매번 다시 채운다
const pctOf=(net,base)=> base>0 ? net/base*100 : null;
// 차트 자료(하루별 · 거래 종목 1분 경로 + 지수) — 로컬 자체 포함 판은 심겨 있고, 껍데기·웹 판은 그날을 펼칠 때 받는다.
const CHART_LOADER = chartLoader || null;   // (day) => Promise<charts|null> · serverMode/로컬 로더가 boot에 넘긴다(boot 밖에서 대입하면 다른 변수다)
const CHART_CACHE = new Map();
function chartsFor(d){
  const key=(d._owner||d.person)+'|'+d.day;
  if(CHART_CACHE.has(key)) return Promise.resolve(CHART_CACHE.get(key));
  let p;
  if(DATA.charts && DATA.charts[d.person+'|'+d.day]) p=Promise.resolve(DATA.charts[d.person+'|'+d.day]);
  else if(CHART_LOADER) p=CHART_LOADER(d).catch(()=>null);
  else p=Promise.resolve(null);
  return p.then(c=>{ CHART_CACHE.set(key,c||null); return c||null; });
}
function monthKey(d){ return d.slice(0,4)+'-'+d.slice(4,6); }

// ── 사람·계좌 묶음 ─────────────────────────────────────────────────────────────
const groups = [];
{
  const map = new Map();
  for (const d of DATA.days){
    const key = d.person+'|'+(d.scope||'?');
    if(!map.has(key)) map.set(key,{key,person:d.person,scope:d.scope,days:[]});
    map.get(key).days.push(d);
  }
  for (const g of map.values()){ g.days.sort((a,b)=>a.day<b.day?-1:1); g.first=g.days[0].day; g.last=g.days[g.days.length-1].day; groups.push(g); }
  for (const g of groups) g.compareOnly = g.days.every(d=>d.compareOnly===true);   // 서버가 「비교만」으로 준 묶음 — 위 선택 상자에는 안 나오고 비교 탭의 B 후보로만
  groups.sort((a,b)=> (a.person==='나'?0:1)-(b.person==='나'?0:1) || (a.last<b.last?1:-1));
}
const viewable = () => groups.filter(g=>!g.compareOnly);
const state = { scope: viewable().length?viewable()[0].key:null, range:'all', tab:'daily', day:null };
try{ const s=JSON.parse(localStorage.getItem('tstudio-viewer')||'{}'); if(groups.some(g=>g.key===s.scope)) Object.assign(state,s); }catch(e){}
// 주소 끝 #20260915 로 열면 그날을 바로 펼친다(링크로 나눌 수 있게).
{ const m=/^#(\d{8})$/.exec(location.hash||''); if(m){ const g=groups.find(x=>x.days.some(d=>d.day===m[1])); if(g){ state.scope=g.key; state.day=m[1]; state.tab='daily'; state.range='all'; } }
  else if(/^#(weekly|monthly|daily|compare)$/.test(location.hash||'')){ state.tab=location.hash.slice(1); state.day=null; } }
function save(){ try{ localStorage.setItem('tstudio-viewer', JSON.stringify(state)); }catch(e){} try{ history.replaceState(null,'', state.day? '#'+state.day : '#'+state.tab); }catch(e){} }

function daysOfGroup(key){
  const g = groups.find(x=>x.key===key); if(!g) return [];
  let days = g.days;
  if(state.range==='7'||state.range==='30'){ days = days.slice(-Number(state.range)); }
  else if(state.range==='month'){ const m = monthKey(g.last); days = days.filter(d=>monthKey(d.day)===m); }
  return days;
}
function groupDays(){ return daysOfGroup(state.scope); }
function sum(days){
  const o={trades:0,wins:0,losses:0,flats:0,net:0,cost:0,buy:0,days:days.length,best:null,worst:null,byLane:{},bySell:{}};
  for(const d of days){
    const c=d.counts||{}, m=d.money||{};
    o.trades+=c.trades||0; o.wins+=c.wins||0; o.losses+=c.losses||0; o.flats+=c.flats||0; o.net+=m.net||0;
    for(const r of d.rows||[]){ o.cost+=r.cost||0; o.buy+=r.buyAmount||0; const l=o.byLane[r.lane]||(o.byLane[r.lane]={trades:0,wins:0,net:0}); l.trades++; if((r.net||0)>0) l.wins++; l.net+=r.net||0;
      const s=o.bySell[r.sellReason||'—']||(o.bySell[r.sellReason||'—']={trades:0,wins:0,net:0}); s.trades++; if((r.net||0)>0) s.wins++; s.net+=r.net||0; }
    if(o.best==null||(m.net||0)>o.best.net) o.best={day:d.day,net:m.net||0};
    if(o.worst==null||(m.net||0)<o.worst.net) o.worst={day:d.day,net:m.net||0};
  }
  o.winRate = o.trades? o.wins/o.trades*100 : null;
  return o;
}

// ── 머리 컨트롤 ───────────────────────────────────────────────────────────────
function renderControls(){
  document.getElementById('controls').style.display='';
  if(DATA.since||DATA.until){ const m=$('#meta'); if(!m.dataset.range){ m.dataset.range='1'; m.textContent += ` · 담은 범위 ${DATA.since?ymd(DATA.since):'처음'}~${DATA.until?ymd(DATA.until):'마지막 집계본'}`; } }
  const sel=$('#scope'); sel.innerHTML = viewable().map(g=>`<option value="${esc(g.key)}"${g.key===state.scope?' selected':''}>${esc(g.person)} · ${md(g.first)}~${md(g.last)} · ${g.days.length}일 · ${esc((g.scope||'').slice(0,12))}</option>`).join('');
  sel.onchange = e => { state.scope=e.target.value; state.day=null; save(); render(); };
  const ranges=[['all','전체'],['30','최근 30일'],['7','최근 7일'],['month','이달']];
  $('#range').innerHTML = ranges.map(([k,l])=>`<button data-k="${k}" class="${state.range===k?'on':''}">${l}</button>`).join('');
  $('#range').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.range=b.dataset.k; save(); render();});
  const tabs=[['daily','일별'],['weekly','주별'],['monthly','월별'],['compare','비교']];
  $('#tab').innerHTML = tabs.map(([k,l])=>`<button data-k="${k}" class="${state.tab===k?'on':''}">${l}</button>`).join('');
  $('#tab').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.k; save(); render();});
  const g=groups.find(x=>x.key===state.scope); const person=g?g.person:'나';
  const cap=$('#capital'); cap.value=Math.round(CAPITAL).toLocaleString('ko-KR');
  const mine = !SERVER_CAPS || person==='나'; cap.disabled=!mine;
  cap.title = mine ? `${person}의 운영자금 — ${SERVER_CAPS?'서버에 저장된다 · 자기 것만 고칠 수 있다':'사용자마다 따로 기억한다'}` : `${person}의 운영자금 — 그 사람이 정한 값 · 여기서는 못 바꾼다`;
  const msg=$('#capmsg'); if(msg) msg.textContent = mine ? '' : '(본인만 변경)';
  cap.onchange=()=>{ const v=Number(String(cap.value).replace(/[^0-9]/g,'')); if(!(v>0)||!mine){ render(); return; }
    setCapital(person,v).then(()=>{ if(msg&&SERVER_CAPS){ msg.textContent='저장됨'; setTimeout(()=>{ if(msg.textContent==='저장됨') msg.textContent=''; },2000); } })
      .catch(err=>{ if(msg) msg.textContent='저장 실패 — '+(err.message||err); });
    render(); };
}

// ── 타일 ─────────────────────────────────────────────────────────────────────
function renderTiles(days){
  const o=sum(days);
  const tiles=[
    ['순손익 합', `<span class="${cls(o.net)}">${won(o.net)}</span>`, `${o.days}거래일 · 비용 ${wonPlain(o.cost)}`],
    ['운영자금 대비', `<span class="${cls(o.net)}">${pct(pctOf(o.net,CAPITAL))}</span>`, `운영자금 ${wonPlain(CAPITAL)} 기준`],
    ['매수금 대비', `<span class="${cls(o.net)}">${pct(pctOf(o.net,o.buy))}</span>`, `매수금 합 ${wonPlain(o.buy)}`],
    ['거래일 평균', `<span class="${cls(o.net)}">${o.days?won(o.net/o.days):'—'}</span>`, o.days?`운영자금 대비 ${pct(pctOf(o.net/o.days,CAPITAL))}/일`:''],
    ['완결 거래', n(o.trades)+'건', `이익 ${o.wins} · 손실 ${o.losses}${o.flats?' · 무 '+o.flats:''}`],
    ['승률', o.winRate==null?'—':pctPlain(o.winRate), `거래 ${o.trades}건 기준`],
    ['최저 거래일', o.worst?`<span class="${cls(o.worst.net)}">${won(o.worst.net)}</span>`:'—', o.worst?md(o.worst.day)+' ('+dow(o.worst.day)+')':''],
  ];
  $('#tiles').innerHTML = tiles.map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
}

// ── 차트 ─────────────────────────────────────────────────────────────────────
function barChart(items, opt){
  // items: [{label, value, key}] · 양수 빨강(이익) · 음수 파랑(손실) — 한국 관행.
  const W=opt.width||900, H=opt.height||220, L=64, R=12, T=14, B=34, iw=W-L-R, ih=H-T-B;
  const vals=items.map(i=>i.value||0); let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn){mx=1;mn=-1;}
  const pad=(mx-mn)*0.08; mx+=pad; mn-=pad;
  const y=v=>T+(mx-v)/(mx-mn)*ih, y0=y(0);
  const slot=iw/Math.max(items.length,1), bw=Math.max(3,Math.min(28,slot-2));
  const ticks=niceTicks(mn,mx,4);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title)}">`;
  for(const t of ticks) s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${opt.fmtAxis(t)}</text>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--axis)" stroke-width="1"/>`;
  const every=Math.ceil(items.length/Math.max(1,Math.floor(iw/46)));
  items.forEach((it,i)=>{
    const v=it.value||0, x=L+i*slot+(slot-bw)/2, top=Math.min(y(v),y0), h=Math.max(1,Math.abs(y(v)-y0));
    const r=Math.min(4,bw/2);
    const path = v>=0 ? `M${x},${y0} V${top+r} a${r},${r} 0 0 1 ${r},-${r} H${x+bw-r} a${r},${r} 0 0 1 ${r},${r} V${y0} Z`
                      : `M${x},${y0} V${top+h-r} a${r},${r} 0 0 0 ${r},${r} H${x+bw-r} a${r},${r} 0 0 0 ${r},-${r} V${y0} Z`;
    s+=`<path d="${path}" fill="${v>=0?'var(--gain)':'var(--loss)'}" data-i="${i}"/>`;
    s+=`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}" class="hit" style="cursor:${opt.onPick?'pointer':'default'}"/>`;
    if(i%every===0) s+=`<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(it.label)}</text>`;
  });
  s+=`</svg><div class="tip"></div>`;
  return attach(s, items, opt);
}
function lineChart(items, opt){
  const W=opt.width||900, H=opt.height||220, L=64, R=12, T=14, B=34, iw=W-L-R, ih=H-T-B;
  const vals=items.map(i=>i.value||0); let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn){mx=1;mn=-1;}
  const pad=(mx-mn)*0.08; mx+=pad; mn-=pad;
  const y=v=>T+(mx-v)/(mx-mn)*ih, y0=y(0), slot=iw/Math.max(items.length,1), x=i=>L+i*slot+slot/2;
  const ticks=niceTicks(mn,mx,4);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title)}">`;
  for(const t of ticks) s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${opt.fmtAxis(t)}</text>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--axis)"/>`;
  const pts=items.map((it,i)=>`${x(i)},${y(it.value||0)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  const every=Math.ceil(items.length/Math.max(1,Math.floor(iw/46)));
  items.forEach((it,i)=>{
    s+=`<circle cx="${x(i)}" cy="${y(it.value||0)}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    s+=`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}" class="hit" style="cursor:${opt.onPick?'pointer':'default'}"/>`;
    if(i%every===0) s+=`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(it.label)}</text>`;
  });
  s+=`</svg><div class="tip"></div>`;
  return attach(s, items, opt);
}
function niceTicks(mn,mx,count){
  const span=mx-mn, raw=span/count, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p, step=(m<1.5?1:m<3?2:m<7?5:10)*p;
  const out=[]; for(let v=Math.ceil(mn/step)*step; v<=mx; v+=step) out.push(Math.abs(v)<1e-9?0:v); return out;
}
function attach(svg, items, opt){
  const el=document.createElement('div'); el.className='chart'; el.innerHTML=svg;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mousemove',e=>{ const it=items[+r.dataset.i]; tip.style.display='block'; tip.innerHTML=opt.tip(it); const b=el.getBoundingClientRect(); tip.style.left=(e.clientX-b.left)+'px'; tip.style.top=(e.clientY-b.top)+'px'; });
    r.addEventListener('mouseleave',()=>tip.style.display='none');
    if(opt.onPick) r.addEventListener('click',()=>opt.onPick(items[+r.dataset.i]));
  });
  return el;
}
const axisWon = v => Math.abs(v)>=10000 ? (v/10000).toFixed(Math.abs(v)>=100000?0:1)+'만' : Math.round(v).toLocaleString('ko-KR');

// ── 본문 ─────────────────────────────────────────────────────────────────────
function render(){
  { const g=groups.find(x=>x.key===state.scope); CAPITAL=capitalOf(g?g.person:'나'); }
  renderControls();
  const days=groupDays();
  renderTiles(days);
  const main=$('#main'); main.innerHTML='';
  if(!days.length){ main.innerHTML='<div class="card empty">이 범위에 집계본이 없다.</div>'; $('#day').innerHTML=''; return; }
  if(state.tab==='daily') renderDaily(days, main);
  else if(state.tab==='compare') renderCompare(main);
  else renderPeriod(days, main, state.tab==='weekly'?isoWeekKey:monthKey, state.tab==='weekly'?'주':'월');
  if(state.day && !days.some(d=>d.day===state.day)) state.day=null;
  renderDay(days.find(d=>d.day===state.day));
}

function renderDaily(days, main){
  const pick = it => { state.day=it.key; save(); render(); document.getElementById('day').scrollIntoView({behavior:'smooth',block:'start'}); };
  const bars=days.map(d=>({key:d.day,label:md(d.day),value:(d.money||{}).net||0,d}));

  c1.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:var(--gain)"></i>이익</span><span><i style="background:var(--loss)"></i>손실</span><span class="small">막대를 누르면 그날로 내려간다</span></div>');

  const o=sum(days);
  const laneRows=LANE_ORDER.map(l=>{const v=o.byLane[l]||{trades:0,wins:0,net:0}; return `<tr><td><span class="lane" style="background:${LANE_COLOR[l]}"></span>${LANE_LABEL[l]}</td><td class="num">${v.trades}</td><td class="num">${v.trades?pctPlain(v.wins/v.trades*100):'—'}</td><td class="num ${cls(v.net)}">${won(v.net)}</td></tr>`;}).join('');
  const sellRows=Object.entries(o.bySell).sort((a,b)=>b[1].trades-a[1].trades).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.trades}</td><td class="num">${v.trades?pctPlain(v.wins/v.trades*100):'—'}</td><td class="num ${cls(v.net)}">${won(v.net)}</td></tr>`).join('');
  main.insertAdjacentHTML('beforeend',`<div class="grid2">
    <div class="card"><h2>레인별 (범위 합)</h2><div class="tw"><table><tr><th>레인</th><th class="num">거래</th><th class="num">승률</th><th class="num">순손익</th></tr>${laneRows}</table></div></div>
    <div class="card"><h2>매도 사유별 (범위 합)</h2><div class="tw"><table><tr><th>사유</th><th class="num">거래</th><th class="num">승률</th><th class="num">순손익</th></tr>${sellRows||'<tr><td colspan="4" class="empty">—</td></tr>'}</table></div></div>
  </div>`);

  const rows=[...days].reverse().map(d=>{const c=d.counts||{},m=d.money||{}; const buy=(d.rows||[]).reduce((s,r)=>s+(r.buyAmount||0),0); const bestLane=Object.entries(d.funnel||{}).sort((a,b)=>(b[1].net||0)-(a[1].net||0))[0];
    return `<tr class="row ${state.day===d.day?'sel':''}" data-day="${d.day}"><td>${ymd(d.day)} <span class="small">${dow(d.day)}</span></td><td class="num">${c.trades||0}</td><td class="num">${c.wins||0} / ${c.losses||0}</td><td class="num">${c.trades?pctPlain((c.wins||0)/c.trades*100):'—'}</td><td class="num ${cls(m.net)}">${won(m.net)}</td><td class="num ${cls(m.net)}">${pct(pctOf(m.net||0,CAPITAL))}</td><td class="num">${wonPlain(buy)}<div class="small ${cls(m.net)}">${pct(pctOf(m.net||0,buy))}</div></td><td class="num ${cls(m.worst)}">${m.worst!=null?won(m.worst):'—'}</td><td>${bestLane?`<span class="lane" style="background:${LANE_COLOR[bestLane[0]]}"></span>${esc(bestLane[1].label)} <span class="small ${cls(bestLane[1].net)}">${won(bestLane[1].net)}</span>`:'—'}</td><td class="small">${(d.warnings||[]).length?'⚑ '+(d.warnings||[]).length:''}</td></tr>`;}).join('');
  main.insertAdjacentHTML('beforeend',`<div class="card"><h2>거래일 목록</h2><div class="tw"><table><tr><th>날짜</th><th class="num">거래</th><th class="num">이익/손실</th><th class="num">승률</th><th class="num">순손익</th><th class="num">운영자금 대비</th><th class="num">매수금액 · 매수금 대비</th><th class="num">최대 손실 거래</th><th>가장 번 레인</th><th>경고</th></tr>${rows}</table></div></div>`);
  main.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>pick({key:tr.dataset.day}));

function renderPeriod(days, main, keyFn, unit){
  const map=new Map();
  for(const d of days){ const k=keyFn(d.day); if(!map.has(k)) map.set(k,[]); map.get(k).push(d); }
  const periods=[...map.entries()].map(([k,ds])=>({key:k,days:ds,o:sum(ds)}));
  const label=k=> unit==='주' ? weekRange(k) : k;
  const bars=periods.map(p=>({key:p.key,label:label(p.key),value:p.o.net,p}));
  const c=document.createElement('div'); c.className='card'; c.innerHTML=`<h2>${unit}별 순손익${unit==='주'?' <span class="small">(월~금 · 휴장일은 빠진다)</span>':''}</h2>`;
  c.appendChild(barChart(bars,{title:unit+'별 순손익',fmtAxis:axisWon,tip:it=>`${label(it.key)} · ${won(it.value)} · 운영자금 대비 ${pct(pctOf(it.value,CAPITAL))} · ${it.p.o.days}거래일 · ${it.p.o.trades}건`}));
  c.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:var(--gain)"></i>이익</span><span><i style="background:var(--loss)"></i>손실</span></div>');
  main.appendChild(c);
  const rows=[...periods].reverse().map(p=>{const o=p.o; const ll=LANE_ORDER.map(l=>{const v=o.byLane[l]; return v?`<span class="chip"><span class="lane" style="background:${LANE_COLOR[l]}"></span>${LANE_LABEL[l].slice(0,2)} <span class="${cls(v.net)}">${won(v.net)}</span></span>`:'';}).join('');
    return `<tr><td style="white-space:nowrap">${unit==='주'?weekRange(p.key)+' <span class="small">주</span>':p.key}</td><td class="num">${o.days}</td><td class="num">${o.trades}</td><td class="num">${o.wins} / ${o.losses}</td><td class="num">${o.winRate==null?'—':pctPlain(o.winRate)}</td><td class="num ${cls(o.net)}">${won(o.net)}</td><td class="num ${cls(o.net)}">${pct(pctOf(o.net,CAPITAL))}</td><td class="num">${wonPlain(o.buy)}<div class="small ${cls(o.net)}">${pct(pctOf(o.net,o.buy))}</div></td><td class="num">${o.days?won(o.net/o.days):'—'}</td><td class="num ${cls(o.worst&&o.worst.net)}">${o.worst?md(o.worst.day)+' '+won(o.worst.net):'—'}</td><td>${ll}</td></tr>`;}).join('');
  main.insertAdjacentHTML('beforeend',`<div class="card"><h2>${unit}별 표</h2><div class="tw"><table><tr><th>${unit}</th><th class="num">거래일</th><th class="num">거래</th><th class="num">이익/손실</th><th class="num">승률</th><th class="num">순손익</th><th class="num">운영자금 대비</th><th class="num">매수금액 · 매수금 대비</th><th class="num">거래일 평균</th><th class="num">최저 거래일</th><th>레인별</th></tr>${rows}</table></div><div class="small" style="margin-top:6px">${unit}별은 집계본만 합산한다 — 계좌가 다른 날은 위 묶음 선택으로 이미 갈라져 있다.</div></div>`);
}

// ── 비교 — 두 사람(묶음)을 나란히. 다른 사람의 자료는 서버가 허용한 것만 내려오므로 여기서는 받은 묶음만 고를 수 있다. ──
const CMP_A='var(--lane1)', CMP_B='var(--lane2)';   // 범주 팔레트 1·2번(파랑·주황) — 사람 A/B 고정
function groupedBars(items, opt){
  // items: [{label, a, b}] · 두 계열 막대(같은 날 나란히) · 축은 원.
  const W=900, H=220, L=64, R=12, T=14, B=34, iw=W-L-R, ih=H-T-B;
  const vals=items.flatMap(i=>[i.a||0,i.b||0]); let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn){mx=1;mn=-1;}
  const pad=(mx-mn)*0.08; mx+=pad; mn-=pad;
  const y=v=>T+(mx-v)/(mx-mn)*ih, y0=y(0), slot=iw/Math.max(items.length,1), bw=Math.max(3,Math.min(18,(slot-6)/2));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title)}">`;
  for(const t of niceTicks(mn,mx,4)) s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${axisWon(t)}</text>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--axis)"/>`;
  const every=Math.ceil(items.length/Math.max(1,Math.floor(iw/46)));
  items.forEach((it,i)=>{
    const x0=L+i*slot+(slot-2*bw-2)/2;
    for(const [k,v,c] of [['a',it.a,CMP_A],['b',it.b,CMP_B]]){ const val=v||0, x=k==='a'?x0:x0+bw+2, top=Math.min(y(val),y0), h=Math.max(1,Math.abs(y(val)-y0));
      s+=`<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${c}" fill-opacity="${v==null?0.15:1}"/>`; }
    s+=`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}" class="hit"/>`;
    if(i%every===0) s+=`<text x="${L+i*slot+slot/2}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(it.label)}</text>`;
  });
  s+=`</svg><div class="tip"></div>`;
  return attach(s, items, opt);
}
function renderCompare(main){
  const others=groups.filter(g=>g.key!==state.scope);
  const A=groups.find(g=>g.key===state.scope);
  if(!A||!others.length){ main.innerHTML='<div class="card empty">비교할 다른 사람의 자료가 없다 — 관리자가 「허용 표…」에서 «보기»나 «비교»를 열어 주면 그 사람의 묶음이 여기 나타난다.</div>'; return; }
  if(!others.some(g=>g.key===state.cmp)) state.cmp=others[0].key;
  const B=groups.find(g=>g.key===state.cmp);
  const nameOf=g=>`${g.person} · ${md(g.first)}~${md(g.last)}${g.compareOnly?' · 비교만':''}`;
  const dA=daysOfGroup(A.key), dB=daysOfGroup(B.key);
  const capA=capitalOf(A.person), capB=capitalOf(B.person);
  const byA=new Map(dA.map(d=>[d.day,d])), byB=new Map(dB.map(d=>[d.day,d]));
  const dates=[...new Set([...byA.keys(),...byB.keys()])].sort();
  const sA=sum(dA), sB=sum(dB);
  const pick=`<label class="small">B <select id="cmpsel">${others.map(g=>`<option value="${esc(g.key)}"${g.key===state.cmp?' selected':''}>${esc(nameOf(g))} · ${g.days.length}일</option>`).join('')}</select></label>`;
  const tile=(k,va,vb,ca,cb)=>`<tr><th>${k}</th><td class="num ${ca||''}">${va}</td><td class="num ${cb||''}">${vb}</td></tr>`;
  const head=`<div class="card"><div class="dayhead"><h2>비교 — <span style="color:${CMP_A}">A ${esc(nameOf(A))}</span> vs <span style="color:${CMP_B}">B ${esc(nameOf(B))}</span></h2>${pick}</div>
    <div class="small">A는 위 선택 상자의 묶음, B는 여기서 고른다. 같은 범위(${{all:'전체','30':'최근 30일','7':'최근 7일',month:'이달'}[state.range]})를 두 사람에게 같이 건다. 두 사람은 조건식 원문도 설정도 다르므로 «무엇 때문에»를 하나로 지목하지 않는다 — 같은 날 같은 종목의 첫 진입만 짝지어 본다.</div>
    <div class="tw" style="margin-top:8px"><table class="narrow"><tr><th></th><th class="num" style="color:${CMP_A}">A</th><th class="num" style="color:${CMP_B}">B</th></tr>
      ${tile('거래일',sA.days,sB.days)}
      ${tile('순손익 합',won(sA.net),won(sB.net),cls(sA.net),cls(sB.net))}
      ${tile('운영자금 대비',pct(pctOf(sA.net,capA))+` <span class="small">(${wonPlain(capA)})</span>`,pct(pctOf(sB.net,capB))+` <span class="small">(${wonPlain(capB)})</span>`,cls(sA.net),cls(sB.net))}
      ${tile('매수금 대비',pct(pctOf(sA.net,sA.buy)),pct(pctOf(sB.net,sB.buy)),cls(sA.net),cls(sB.net))}
      ${tile('완결 거래',sA.trades+'건 · 이익 '+sA.wins+' · 손실 '+sA.losses,sB.trades+'건 · 이익 '+sB.wins+' · 손실 '+sB.losses)}
      ${tile('승률',sA.winRate==null?'—':pctPlain(sA.winRate),sB.winRate==null?'—':pctPlain(sB.winRate))}
      ${tile('거래일 평균',sA.days?won(sA.net/sA.days):'—',sB.days?won(sB.net/sB.days):'—',cls(sA.net),cls(sB.net))}
      ${tile('건당 평균',sA.trades?won(sA.net/sA.trades):'—',sB.trades?won(sB.net/sB.trades):'—',cls(sA.net),cls(sB.net))}
    </table></div></div>`;
  main.innerHTML=head;
  document.getElementById('cmpsel').onchange=e=>{ state.cmp=e.target.value; save(); render(); };
  // 1. 날짜별 나란히
  const items=dates.map(day=>({key:day,label:md(day),a:byA.has(day)?((byA.get(day).money||{}).net||0):null,b:byB.has(day)?((byB.get(day).money||{}).net||0):null}));
  const c=document.createElement('div'); c.className='card'; c.innerHTML='<h2>날짜별 순손익 나란히</h2>';
  c.appendChild(groupedBars(items,{title:'날짜별 순손익 A vs B',tip:it=>`${ymd(it.key)} · A ${it.a==null?'없음':won(it.a)} · B ${it.b==null?'없음':won(it.b)}`}));
  c.insertAdjacentHTML('beforeend',`<div class="legend"><span><i style="background:${CMP_A}"></i>A ${esc(A.person)}</span><span><i style="background:${CMP_B}"></i>B ${esc(B.person)}</span><span class="small">비어 보이는 막대는 그날 자료가 없는 쪽</span></div>`);
  const dayRows=[...dates].reverse().map(day=>{ const a=byA.get(day), b=byB.get(day); const cell=(d,cap)=>{ if(!d) return '<td class="num small" colspan="3">자료 없음</td>'; const m=d.money||{}, ct=d.counts||{}; return `<td class="num ${cls(m.net)}">${won(m.net)}</td><td class="num small">${ct.trades||0}건 · ${ct.trades?pctPlain((ct.wins||0)/ct.trades*100):'—'}</td><td class="num ${cls(m.net)} small">${pct(pctOf(m.net||0,cap))}</td>`; };
    return `<tr><td>${ymd(day)} <span class="small">${dow(day)}</span></td>${cell(a,capA)}${cell(b,capB)}</tr>`; }).join('');
  c.insertAdjacentHTML('beforeend',`<div class="tw" style="margin-top:8px"><table><tr><th>날짜</th><th class="num" style="color:${CMP_A}">A 순손익</th><th class="num">A 거래·승률</th><th class="num">A 운영자금 대비</th><th class="num" style="color:${CMP_B}">B 순손익</th><th class="num">B 거래·승률</th><th class="num">B 운영자금 대비</th></tr>${dayRows}</table></div>`);
  main.appendChild(c);
  // 2. 레인별 · 매도 사유별 나란히
  const laneRows=LANE_ORDER.map(l=>{ const a=sA.byLane[l]||{trades:0,wins:0,net:0}, b=sB.byLane[l]||{trades:0,wins:0,net:0};
    return `<tr><td><span class="lane" style="background:${LANE_COLOR[l]}"></span>${LANE_LABEL[l]}</td><td class="num">${a.trades}</td><td class="num">${a.trades?pctPlain(a.wins/a.trades*100):'—'}</td><td class="num ${cls(a.net)}">${won(a.net)}</td><td class="num">${b.trades}</td><td class="num">${b.trades?pctPlain(b.wins/b.trades*100):'—'}</td><td class="num ${cls(b.net)}">${won(b.net)}</td></tr>`; }).join('');
  const reasons=[...new Set([...Object.keys(sA.bySell),...Object.keys(sB.bySell)])].sort((x,y)=>((sB.bySell[y]||{}).trades||0)+((sA.bySell[y]||{}).trades||0)-((sB.bySell[x]||{}).trades||0)-((sA.bySell[x]||{}).trades||0));
  const sellRows=reasons.map(k=>{ const a=sA.bySell[k]||{trades:0,wins:0,net:0}, b=sB.bySell[k]||{trades:0,wins:0,net:0};
    return `<tr><td>${esc(k)}</td><td class="num">${a.trades}</td><td class="num">${a.trades?pctPlain(a.wins/a.trades*100):'—'}</td><td class="num ${cls(a.net)}">${won(a.net)}</td><td class="num">${b.trades}</td><td class="num">${b.trades?pctPlain(b.wins/b.trades*100):'—'}</td><td class="num ${cls(b.net)}">${won(b.net)}</td></tr>`; }).join('');
  const hdr=`<tr><th></th><th class="num" style="color:${CMP_A}">A 거래</th><th class="num">A 승률</th><th class="num">A 순손익</th><th class="num" style="color:${CMP_B}">B 거래</th><th class="num">B 승률</th><th class="num">B 순손익</th></tr>`;
  main.insertAdjacentHTML('beforeend',`<div class="grid2"><div class="card"><h2>레인별</h2><div class="tw"><table>${hdr}${laneRows}</table></div></div><div class="card"><h2>매도 사유별</h2><div class="tw"><table>${hdr}${sellRows||'<tr><td colspan="7" class="empty">—</td></tr>'}</table></div></div></div>`);
  // 3. 같은 날 같은 종목의 첫 진입 — 통제 비교
  const firstOf=(days)=>{ const m=new Map(); for(const d of days){ for(const r of [...(d.rows||[])].sort((x,y)=>x.buyAt<y.buyAt?-1:1)){ const k=d.day+'|'+r.code; if(!m.has(k)) m.set(k,{day:d.day,r}); } } return m; };
  const fA=firstOf(dA), fB=firstOf(dB); const shared=[...fA.keys()].filter(k=>fB.has(k)).sort();
  let netA=0, netB=0, earlierA=0;
  const pairRows=shared.map(k=>{ const a=fA.get(k), b=fB.get(k); netA+=a.r.net||0; netB+=b.r.net||0; if(a.r.buyAt<b.r.buyAt) earlierA++;
    const dp=b.r.buyPrice&&a.r.buyPrice?((b.r.buyPrice/a.r.buyPrice-1)*100):null;
    return `<tr><td>${md(a.day)}</td><td>${esc(a.r.name)} <span class="small">${esc(a.r.code)}</span></td><td class="num">${a.r.buyAt}<div class="small">${n(a.r.buyPrice)} · ${esc(a.r.sellReason||'')}</div></td><td class="num ${cls(a.r.net)}">${won(a.r.net)}<div class="small">${pct(a.r.returnPct)}</div></td><td class="num">${b.r.buyAt}<div class="small">${n(b.r.buyPrice)} · ${esc(b.r.sellReason||'')}</div></td><td class="num ${cls(b.r.net)}">${won(b.r.net)}<div class="small">${pct(b.r.returnPct)}</div></td><td class="num small">${dp==null?'—':pct(dp)}</td></tr>`; }).join('');
  main.insertAdjacentHTML('beforeend',`<div class="card"><h2>같은 날 같은 종목의 첫 진입 <span class="small">${shared.length}짝 · A 합 <span class="${cls(netA)}">${won(netA)}</span> · B 합 <span class="${cls(netB)}">${won(netB)}</span> · A가 먼저 산 것 ${earlierA}짝</span></h2>
    <div class="tw"><table><tr><th>날짜</th><th>종목</th><th class="num" style="color:${CMP_A}">A 매수 · 가격 · 사유</th><th class="num">A 순손익</th><th class="num" style="color:${CMP_B}">B 매수 · 가격 · 사유</th><th class="num">B 순손익</th><th class="num">B 매수가 − A</th></tr>${pairRows||'<tr><td colspan="7" class="empty">같은 날 같은 종목을 둘 다 산 짝이 없다</td></tr>'}</table></div>
    <div class="small" style="margin-top:6px">통제 비교 — 조건식과 설정이 다르므로 이것만 짝지어 본다. 재진입은 빼고 그날 그 종목의 첫 거래만이다.</div></div>`);
  // 4. 재진입 순번별
  const nth=(days)=>{ const out={}; const by={}; for(const d of days) for(const r of d.rows||[]){ (by[d.day+'|'+r.code]=by[d.day+'|'+r.code]||[]).push(r); }
    for(const k in by){ by[k].sort((x,y)=>x.buyAt<y.buyAt?-1:1).forEach((r,i)=>{ const n=Math.min(i+1,4); const o=out[n]=out[n]||{trades:0,wins:0,net:0}; o.trades++; if((r.net||0)>0) o.wins++; o.net+=r.net||0; }); } return out; };
  const nA=nth(dA), nB=nth(dB);
  const nthRows=[1,2,3,4].map(i=>{ const a=nA[i]||{trades:0,wins:0,net:0}, b=nB[i]||{trades:0,wins:0,net:0}; return `<tr><td>${i}회차${i===4?' 이상':''}</td><td class="num">${a.trades}</td><td class="num">${a.trades?pctPlain(a.wins/a.trades*100):'—'}</td><td class="num ${cls(a.net)}">${won(a.net)}</td><td class="num">${b.trades}</td><td class="num">${b.trades?pctPlain(b.wins/b.trades*100):'—'}</td><td class="num ${cls(b.net)}">${won(b.net)}</td></tr>`; }).join('');
  main.insertAdjacentHTML('beforeend',`<div class="card"><h2>재진입 — 같은 날 같은 종목을 몇 번째로 샀나</h2><div class="tw"><table>${hdr.replace('<th></th>','<th>순번</th>')}${nthRows}</table></div></div>`);
}

// ── 하루 상세 ─────────────────────────────────────────────────────────────────
function renderDay(d){
  const box=$('#day');
  if(!d){ box.innerHTML = state.tab==='daily' ? '<div class="card empty">날짜를 누르면 그날의 거래·깔때기·매도 사유가 여기에 펼쳐진다.</div>' : ''; return; }
  const c=d.counts||{}, m=d.money||{};
  const links=[d.links.report?`<a href="${d.links.report}" target="_blank">일간 보고서 ↗</a>`:'', d.links.journal?`<a href="${d.links.journal}" target="_blank">매매일지 ↗</a>`:''].join('');
  const rules=d.rules||{};
  const ruleText=`손절 ${pct(rules.stopLossPct,1)} · 본전 ${pct(rules.breakevenArmPct,1)}↑ · 트레일 ${pct(rules.trailArmPct,1)}↑/${pct(rules.trailDropPct,1)} · 비용 왕복 ${pctPlain(d.costPct||0,3)}`;
  const tiles=[
    ['순손익',`<span class="${cls(m.net)}">${won(m.net)}</span>`,`이익 ${wonPlain(m.winSum)} · 손실 ${won(m.lossSum)}`],
    ['운영자금 대비',`<span class="${cls(m.net)}">${pct(pctOf(m.net||0,CAPITAL))}</span>`,`운영자금 ${wonPlain(CAPITAL)}`],
    ['매수금 대비',`<span class="${cls(m.net)}">${pct(pctOf(m.net||0,(d.rows||[]).reduce((s,r)=>s+(r.buyAmount||0),0)))}</span>`,`매수금 합 ${wonPlain((d.rows||[]).reduce((s,r)=>s+(r.buyAmount||0),0))}`],
    ['완결 거래',`${c.trades||0}건`,`이익 ${c.wins||0} · 손실 ${c.losses||0}`],
    ['승률',c.trades?pctPlain((c.wins||0)/c.trades*100):'—',''],
    ['최대 손실 거래',`<span class="${cls(m.worst)}">${won(m.worst)}</span>`,m.worstShareOfLossPct!=null?`손실 합의 ${pctPlain(m.worstShareOfLossPct)}`:''],
    ['손실 갈래',`<span class="txt">${Object.entries(d.lossKinds||{}).filter(([k,v])=>v).map(([k,v])=>`${k} ${v}`).join(' · ')||'—'}</span>`,''],
  ];
  // 거래 한 건 = 카드 하나(왼쪽 매매 정보 · 오른쪽 그 종목 차트에 이 거래의 ▲▼를 굵게, 같은 종목 다른 거래는 흐리게). 차트는 renderDayCharts가 채운다.
  const rows=(d.rows||[]).map((r,i)=>`<div class="tcard"><div class="tinfo">
      <div class="row"><span><b>#${i+1}</b> <span class="lane" style="background:${LANE_COLOR[r.lane]||'var(--muted)'}"></span>${esc(r.name)} <span class="small">${esc(r.code)} · ${esc(LANE_LABEL[r.lane]||r.lane||'')}</span></span></div>
      <div class="row"><span class="big ${cls(r.net)}">${won(r.net)}</span><span class="${cls(r.net)}" style="align-self:end">${pct(r.returnPct)}</span><span class="small" style="align-self:end">${esc(r.sellReason||'—')}</span></div>
      <div><span class="k">매수</span>${r.buyAt} · ${n(r.buyPrice)}원 · ${r.quantity}주 · ${wonPlain(r.buyAmount)}</div>
      <div><span class="k">매도</span>${r.sellAt} · ${n(r.sellPrice)}원 · 보유 ${hold(r.holdSeconds)}</div>
      <div><span class="k">보유 중</span>최고 ${pct((r.held||{}).hi)} · 최저 ${pct((r.held||{}).lo)}</div>
      <div><span class="k">판 뒤</span>+30분 ${pct((r.after||{}).m30)} · +60분 ${pct((r.after||{}).m60)} · <b>${esc(r.afterMark||'')}</b></div>
      <div class="small"><span class="k">살 때</span>등락 ${pct((r.entry||{}).changeRate)} · 창 ${pct((r.entry||{}).windowReturnPct)} · 반등 ${pct((r.entry||{}).bounceFromLowPct)} · 강도 ${n((r.entry||{}).contractStrength)} · ${esc((r.entry||{}).marketRegime||'')}</div>
    </div><div class="tchart" data-i="${i}"><div class="small empty">차트를 받는 중…</div></div></div>`).join('');
  const funnel=LANE_ORDER.map(l=>{const f=(d.funnel||{})[l]; if(!f) return `<tr><td><span class="lane" style="background:${LANE_COLOR[l]}"></span>${LANE_LABEL[l]}</td><td colspan="7" class="empty">—</td></tr>`;
    const rej=((d.rejections||{})[l]||[]).slice(0,3).map(([k,v])=>`${esc(k)} ${n(v)}`).join(' · ');
    return `<tr><td><span class="lane" style="background:${LANE_COLOR[l]}"></span>${esc(f.label)}</td><td class="num">${n(f.evaluated)}</td><td class="num">${n(f.passed)}</td><td class="num">${f.passRatePct==null?'—':f.passRatePct.toFixed(3)+'%'}</td><td class="num">${n(f.passedCodes)}</td><td class="num">${n(f.droppedCapacity)}</td><td class="num ${cls(f.net)}">${won(f.net)}</td><td class="small">${rej}</td></tr>`;}).join('');
  const sell=Object.entries(d.sellReasons||{}).sort((a,b)=>(b[1].cycles||0)-(a[1].cycles||0)).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.cycles}</td><td class="num">${v.winRatePct==null?'—':pctPlain(v.winRatePct)}</td><td class="num ${cls(v.net)}">${won(v.net)}</td><td class="num ${cls(v.netMean)}">${won(v.netMean)}</td></tr>`).join('');
  const losers=(d.losers||[]).map(l=>`<tr><td><span class="lane" style="background:${LANE_COLOR[l.lane]||'var(--muted)'}"></span>${esc(l.name)} <span class="small">${esc(l.code)}</span></td><td>${esc(l.sellReason||'—')}</td><td>${esc(l.kind||'—')}</td><td class="num loss">${won(l.net)}</td><td class="num">${pct(l.returnPct)}</td><td class="num">${pct(l.hi)} / ${pct(l.lo)}</td><td class="num">${hold(l.holdSeconds)}</td></tr>`).join('');
  const comp=d.completeness||{};
  const gaps=(comp.tickGaps||[]).map(g=>`${g[0]}~${g[1]} (${g[2]}초)`).join(', ');
  box.innerHTML=`<div class="card">
    <div class="dayhead"><h2>${ymd(d.day)} (${dow(d.day)}) · ${esc(d.person)}</h2><div class="links">${links}</div></div>
    <div class="small">${ruleText} · 앱 ${esc((d.appVersions||[]).join(', '))} · 집계 ${esc(d.generatedAt||'')} · 계좌 ${esc(d.scope||'')}</div>
    <div class="tiles" style="margin-top:10px">${tiles.map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('')}</div>
    ${(d.warnings||[]).map(w=>`<div class="warn">⚑ ${esc(w)}</div>`).join('')}
    <h3 style="margin-top:12px">지수 <span class="small">(시가 대비 %)</span></h3>
    <div id="dayindex" class="grid2"><div class="empty small">차트를 받는 중…</div></div>
    <h3 style="margin-top:12px">거래 ${(d.rows||[]).length}건 (시간 순) <span class="small">· 오른쪽 차트는 그 종목 1분 경로 · ▲ 매수 ▼ 매도 · 이 거래는 굵게, 같은 종목 다른 거래는 흐리게 · 점선은 시가</span></h3>
    <div id="daytrades">${rows||'<div class="empty">완결 거래가 없다</div>'}</div>
    <div class="grid2" style="margin-top:12px">
      <div><h3>손실 거래</h3><div class="tw"><table><tr><th>종목</th><th>사유</th><th>갈래</th><th class="num">순손익</th><th class="num">수익률</th><th class="num">최고/최저</th><th class="num">보유</th></tr>${losers||'<tr><td colspan="7" class="empty">—</td></tr>'}</table></div></div>
      <div><h3>매도 사유별</h3><div class="tw"><table><tr><th>사유</th><th class="num">건</th><th class="num">승률</th><th class="num">순손익</th><th class="num">건당</th></tr>${sell||'<tr><td colspan="5" class="empty">—</td></tr>'}</table></div></div>
    </div>
    <h3 style="margin-top:12px">진입 규칙이 막은 재진입 <span class="small">(같은 날 · 직전가 위 / 하루 상한 · ${(d.reentryBlocks||[]).length}건)</span></h3>
    <div class="tw"><table><tr><th>시각</th><th>종목 · 규칙</th><th class="num">직전 매수가 / 접수</th><th class="num">신호가</th><th class="num">+30분 / +60분</th><th class="num">이후 최고/최저</th><th>판정</th></tr>${(d.reentryBlocks||[]).map(b=>`<tr><td>${esc(b.kst)}</td><td>${esc(b.name||'')} <span class="small">${esc(b.code)} · ${b.rule==='count'?'하루 상한':'직전가 위'}</span></td><td class="num">${b.prevBuy?n(b.prevBuy):`오늘 ${b.attempts}회 / 상한 ${b.cap}회`}</td><td class="num">${n(b.signal)} <span class="small">${b.abovePct!=null?pct(b.abovePct):''}</span></td><td class="num">${pct((b.after||{}).m30)} / ${pct((b.after||{}).m60)}</td><td class="num">${pct((b.after||{}).hi)} / ${pct((b.after||{}).lo)}</td><td>${esc(b.mark||'')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">— 막힌 재진입 없음(규칙 도입 전이거나 해당 없음)</td></tr>'}</table></div>
    <h3 style="margin-top:12px">진입 깔때기 (레인별)</h3>
    <div class="tw"><table><tr><th>레인</th><th class="num">평가</th><th class="num">통과</th><th class="num">통과율</th><th class="num">통과 종목</th><th class="num">용량 초과</th><th class="num">순손익</th><th>주요 거절 사유</th></tr>${funnel}</table></div>
    <div class="small" style="margin-top:8px">완결성 — 0B ${n(comp.tickLines)}줄 · ${n(comp.tickCodes)}종목 · ${esc(comp.tickFirst||'')}~${esc(comp.tickLast||'')} · 그림자 ${n(comp.shadowRows)}줄${comp.shadowIncomplete?' · 미완결 '+comp.shadowIncomplete:''}${gaps?' · 틱 공백 '+gaps:''}</div>
  </div>`;
  renderDayCharts(d);
}

// ── 종목 차트 — 1분 가격 경로 + 매수▲·매도▼ 표시. 축은 09:00~15:30 고정(날마다 같은 자리에 같은 시간). ──
const DAY_START=32400, DAY_END=55800;
const hmsOfSec=s=>`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`;
const secOfHms=h=>{ const m=/^(\d\d):(\d\d)(?::(\d\d))?$/.exec(h||''); return m? (+m[1])*3600+(+m[2])*60+(+(m[3]||0)) : null; };
function priceChart(series, marks, opt){
  const W=560, H=opt.height||150, L=58, R=10, T=16, B=22, iw=W-L-R, ih=H-T-B;
  const vals=series.p.filter(v=>v!=null);
  let mn=Math.min(...vals, ...marks.map(m=>m.p)), mx=Math.max(...vals, ...marks.map(m=>m.p));
  if(!(mx>mn)){ mx=mn+1; }
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const x=s=>L+(s-DAY_START)/(DAY_END-DAY_START)*iw, y=v=>T+(mx-v)/(mx-mn)*ih;
  const base=opt.basePrice; // 기준가(시가) — 수평선
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title)}">`;
  for(const hh of [32400,36000,39600,43200,46800,50400,54000]){ s+=`<line x1="${x(hh)}" x2="${x(hh)}" y1="${T}" y2="${T+ih}" stroke="var(--grid)"/><text x="${x(hh)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${hmsOfSec(hh)}</text>`; }
  for(const t of niceTicks(mn,mx,3)) s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-5}" y="${y(t)+3}" text-anchor="end" font-size="10" fill="var(--muted)">${opt.fmtAxis(t)}</text>`;
  if(base!=null && base>mn && base<mx) s+=`<line x1="${L}" x2="${W-R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--axis)" stroke-dasharray="3,3"/>`;
  let d='', pen=false;
  series.p.forEach((v,i)=>{ if(v==null){ pen=false; return; } const px=x(series.first+i*series.step), py=y(v); d+=(pen?'L':'M')+px.toFixed(1)+','+py.toFixed(1); pen=true; });
  s+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>`;
  for(const m of marks){ const px=x(m.t), py=y(m.p); const up=m.kind==='buy'; const strong=m.strong!==false; const h=strong?10:6, w=strong?7:4, op=strong?1:0.45;
    s+=`<path d="${up?`M${px},${py-h} L${px-w},${py+1} L${px+w},${py+1} Z`:`M${px},${py+h} L${px-w},${py-1} L${px+w},${py-1} Z`}" fill="${up?'var(--gain)':'var(--loss)'}" fill-opacity="${op}" stroke="var(--surface)" stroke-width="1"><title>${esc(m.label)}</title></path>`; }
  s+=`<rect class="hit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
  const el=document.createElement('div'); el.className='chart'; el.innerHTML=`<div class="small" style="margin:0 0 2px">${opt.title}</div>`+s;
  const tip=el.querySelector('.tip'), hit=el.querySelector('.hit'), svg=el.querySelector('svg');
  hit.addEventListener('mousemove',e=>{ const b=svg.getBoundingClientRect(); const vx=(e.clientX-b.left)/b.width*W; const sec=DAY_START+Math.max(0,Math.min(1,(vx-L)/iw))*(DAY_END-DAY_START); const i=Math.round((sec-series.first)/series.step); const v=series.p[i]; if(v==null){ tip.style.display='none'; return; } tip.style.display='block'; tip.innerHTML=`${hmsOfSec(series.first+i*series.step)} · ${opt.fmtTip(v)}`; const eb=el.getBoundingClientRect(); tip.style.left=(e.clientX-eb.left)+'px'; tip.style.top=(e.clientY-eb.top)+'px'; });
  hit.addEventListener('mouseleave',()=>tip.style.display='none');
  return el;
}
function renderDayCharts(d){
  const idx=document.getElementById('dayindex'); if(!idx) return;
  chartsFor(d).then(ch=>{
    const idxNow=document.getElementById('dayindex'); if(!idxNow) return;   // 그 사이 다른 날로 갔다
    const slots=[...document.querySelectorAll('#daytrades .tchart')];
    if(!ch){ idxNow.innerHTML='<div class="empty small">이 날의 차트 자료가 없다(자료를 올린 뒤 펼치면 보인다)</div>'; for(const s of slots) s.innerHTML='<div class="small empty">차트 자료 없음</div>'; return; }
    idxNow.innerHTML='';
    for(const [k,label] of [['KOSPI','코스피'],['KOSDAQ','코스닥']]){
      const s=(ch.index||{})[k]; if(!s) continue;
      const first=s.p.find(v=>v!=null); if(first==null) continue;
      const rel={first:s.first,step:s.step,p:s.p.map(v=>v==null?null:(v/first-1)*100)};
      const last=[...s.p].reverse().find(v=>v!=null);
      idxNow.appendChild(priceChart(rel,[],{title:`${label} · 시가 대비 ${pct((last/first-1)*100)}`,basePrice:0,fmtAxis:v=>v.toFixed(1)+'%',fmtTip:v=>pct(v),height:110}));
    }
    if(!idxNow.children.length) idxNow.innerHTML='<div class="empty small">지수 자료 없음</div>';
    // 거래 카드마다 그 종목 차트 — 이 거래의 ▲▼는 굵게, 같은 종목의 다른 거래는 흐리게.
    for(const slot of slots){
      const i=+slot.dataset.i, r=(d.rows||[])[i]; if(!r){ continue; }
      const s=(ch.symbols||{})[r.code];
      if(!s){ slot.innerHTML='<div class="small empty">이 종목의 차트 자료 없음</div>'; continue; }
      const marks=[];
      for(const o of (d.rows||[]).filter(x=>x.code===r.code)){ const strong=(o===r); const bt=secOfHms(o.buyAt), st=secOfHms(o.sellAt);
        if(bt!=null&&o.buyPrice) marks.push({kind:'buy',t:bt,p:o.buyPrice,strong,label:`매수 ${o.buyAt} ${n(o.buyPrice)} · ${o.quantity}주`});
        if(st!=null&&o.sellPrice) marks.push({kind:'sell',t:st,p:o.sellPrice,strong,label:`매도 ${o.sellAt} ${n(o.sellPrice)} · ${esc(o.sellReason||'')} · ${won(o.net)}`}); }
      const open=s.p.find(v=>v!=null), last=[...s.p].reverse().find(v=>v!=null);
      slot.innerHTML='';
      slot.appendChild(priceChart(s,marks,{title:`${esc(r.name)} <span class="small">${esc(r.code)}</span> · 시가 대비 ${pct((last/open-1)*100)}`,basePrice:open,fmtAxis:v=>Math.round(v).toLocaleString('ko-KR'),fmtTip:v=>Math.round(v).toLocaleString('ko-KR')+'원',height:150}));
    }
  });
}

render();
}

// ── 웹 판 — 로그인 · 볼 수 있는 사람의 자료 받기 · 관리자 허용 표 ─────────────────

// 로그인은 앱과 같은 Supabase 계정이다(라이선스 서버). 자료는 함수가 권한을 보고 내준다.
const SERVER = {"url": "https://pfklheuhfbktoagheurx.supabase.co", "anonKey": "sb_publishable_eSt78PdGdsbVkjF6zKoXeg_qnvggL8g", "fn": "https://pfklheuhfbktoagheurx.supabase.co/functions/v1/report-viewer"};
function serverMode(){
  const FN = SERVER.fn || (location.origin + location.pathname);
  const AUTH_KEY = 'tstudio-viewer-auth';
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const loadAuth = () => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); } catch(e){ return null; } };
  const saveAuth = a => { try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch(e){} };
  const main = document.getElementById('main');
  async function authApi(grant, body){
    const r = await fetch(SERVER.url+'/auth/v1/token?grant_type='+grant, {method:'POST', headers:{'content-type':'application/json','apikey':SERVER.anonKey}, body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error_description||j.msg||j.message||('HTTP '+r.status));
    return {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600), email:(j.user||{}).email||body.email||''};
  }
  async function session(){
    let a = loadAuth(); if(!a) return null;
    if(Date.now()/1000 > (a.expires_at||0) - 60){
      try { a = await authApi('refresh_token', {refresh_token:a.refresh_token}); saveAuth(a); }
      catch(e){ saveAuth(null); return null; }

    return a;
  }
  async function call(action, body){
    const a = await session(); if(!a) throw Object.assign(new Error('로그인이 필요하다'), {auth:true});
    const r = await fetch(FN, {method:'POST', headers:{'content-type':'application/json','authorization':'Bearer '+a.access_token,'apikey':SERVER.anonKey}, body:JSON.stringify(Object.assign({action}, body||{}))});
    const j = await r.json().catch(()=>({}));
    if(r.status===401){ saveAuth(null); throw Object.assign(new Error(j.message||'로그인이 필요하다'), {auth:true}); }
    if(!r.ok) throw new Error(j.message||('HTTP '+r.status));

  function showLogin(msg){

    const f = document.getElementById('login');

      try { saveAuth(await authApi('password', {email:document.getElementById('email').value.trim(), password:document.getElementById('pw').value})); await load(); }
      catch(err){ m.textContent = '로그인 실패 — ' + (err.message||err); }

    bar.innerHTML = `<span class="small">${esc(me.email)}${me.isAdmin?' · 관리자':''}</span>${me.isAdmin?'<button id="adminbtn">허용 표…</button>':''}<button id="logout">로그아웃</button>`;

  }

      const a = await call('admin');

      const owners = a.owners||[];
      if(!owners.length){ box.innerHTML = '<h2>허용 표</h2><div class="empty">아직 올라온 보고서가 없다.</div>'; return; }
      const head = owners.map(o=>`<th class="num">${esc(o.email)}<div class="small">${esc(o.lastDay||'')}까지 ${o.days}일</div></th>`).join('');
      const rows = (a.users||[]).map(u=>{
        const cells = owners.map(o=>{
          const self = u.userId===o.userId, adm = admins.has(u.userId);

      box.innerHTML = `<div class="dayhead"><h2>허용 표 — 행의 사용자에게 열의 보고서를 보여준다</h2><span class="small">«보기» = 보고서 전부(하루 상세·차트) · «비교» = 비교 탭에서만(날짜별 합계·거래 행 요약) · 자기 것·관리자는 늘 전부 · 체크는 바로 저장된다</span></div>
        <div class="tw"><table><tr><th>사용자 ↓ · 보고서 주인 →</th>${head}</tr>${rows}</table></div><div id="adminmsg" class="small" style="margin-top:6px;min-height:18px"></div>`;
      box.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = async () => {

  async function load(){

      const parts = await Promise.all(owners.map(o => call('data', {ownerUserId:o.userId}).then(r => ({o, d:r.data})).catch(err => ({o, err}))));

           {map:capMap, save: v => call('capital', {capital:v})});

  session().then(a => a ? load() : showLogin(''));

// ── 자료를 어디서 받나 ─────────────────────────────────────────────────────────
// 심은 JSON이 있으면(자체 포함 판) 그것을, 웹 판(SERVER)이면 로그인 뒤 함수에서, 그도 아니면(껍데기를 로컬 서버로) 옆의 viewer-data.json을 받는다.
// 화면 코드(boot)는 셋 다 같다.
(function(){
  const el=document.getElementById('data'), text=(el&&el.textContent||'').trim();
  if(text){ boot(JSON.parse(text)); return; }
  if(SERVER && SERVER.url){ serverMode(); return; }
  const url=(document.querySelector('meta[name="viewer-data"]')||{}).content||'viewer-data.json';
  const localCharts = d => d.chartsFile ? fetch(d.chartsFile,{cache:'no-store'}).then(r=>r.ok?r.json():null) : Promise.resolve(null);
  fetch(url,{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{ const m=document.getElementById('meta'); if(m) m.textContent=m.textContent.replace('(서버 자료)', d.generatedAt||''); boot(d, localCharts); })
    .catch(e=>{ document.getElementById('main').innerHTML='<div class="card empty">자료를 받지 못했다 — '+String(e.message||e).replace(/</g,'&lt;')+'<br>이 껍데기는 서버(또는 localhost)에서 열어야 한다. 파일로 열려면 자체 포함 판 viewer.html을 쓴다.</div>'; });
})();
