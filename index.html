<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewer-data" content="viewer-data.json">
<title>T-Studio 매매 보고서 뷰어</title>
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --gain:#e34948;--loss:#2a78d6;--gain-text:#b83432;--loss-text:#1c5cab;--accent:#2a78d6;--wash:rgba(11,11,11,.05);
  --lane1:#2a78d6;--lane2:#eb6834;--lane3:#1baf7a;--lane4:#eda100;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
    --gain:#e66767;--loss:#3987e5;--gain-text:#e66767;--loss-text:#5598e7;--accent:#3987e5;--wash:rgba(255,255,255,.06);
    --lane1:#3987e5;--lane2:#d95926;--lane3:#199e70;--lane4:#c98500;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --gain:#e66767;--loss:#3987e5;--gain-text:#e66767;--loss-text:#5598e7;--accent:#3987e5;--wash:rgba(255,255,255,.06);
  --lane1:#3987e5;--lane2:#d95926;--lane3:#199e70;--lane4:#c98500;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
body{padding:16px;max-width:1180px;margin:0 auto}
h1{font-size:18px;margin:0;font-weight:700}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
h3{font-size:13px;margin:0 0 6px;font-weight:700;color:var(--ink2)}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.top .meta{color:var(--muted);font-size:12px}
.top>*{min-width:0;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;max-width:100%}
select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 9px;max-width:100%}
.seg{flex-wrap:wrap}
button{cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:transparent}
button:hover:not(.on){background:var(--wash)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.tile .v .txt{font-size:14px;font-weight:600;display:block;margin-top:6px}
.tile .s{font-size:12px;color:var(--ink2);margin-top:2px}
.gain{color:var(--gain-text)}.loss{color:var(--loss-text)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--muted);font-weight:600;text-align:left;white-space:nowrap;font-size:12px}
th.num{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--wash)}
tr.sel td{background:var(--wash);box-shadow:inset 3px 0 var(--accent)}
.tw{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:4px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lane{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--wash);font-size:12px;margin-right:4px}
.links a{margin-right:12px;color:var(--accent)}
.warn{font-size:12px;color:var(--ink2);border-left:3px solid var(--lane4);padding:4px 8px;margin:4px 0;background:var(--wash)}
.small{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
</style>
</head>
<body>
<div class="top">
  <div><h1>T-Studio 매매 보고서 뷰어</h1><div class="meta" id="meta">생성 (서버 자료) · 뷰어 형식 v1 · 내부용 · 집계본만 읽는다(원본을 다시 읽지 않는다)</div></div>
  <div class="bar" id="controls" style="margin:0">
    <select id="scope"></select>
    <span class="seg" id="range"></span>
    <span class="seg" id="tab"></span>
    <label class="small" title="하루에 굴리는 돈(일일매수금액한도). 순손익을 이 금액으로 나눈 수익률을 보여준다">운영자금 <input id="capital" type="text" inputmode="numeric" style="width:110px;text-align:right;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 7px"> 원</label>
  </div>
</div>
<div id="tiles" class="tiles"></div>
<div id="main"></div>
<div id="day"></div>
<script id="data" type="application/json"></script>
<script>
function boot(DATA){
const LANE_ORDER = DATA.laneOrder, LANE_LABEL = DATA.laneLabel;
const LANE_COLOR = {MULTI_DAY_OVERSOLD:'var(--lane1)',VOLUME_SURGE_REBOUND:'var(--lane2)',DEEP_DROP_REBOUND:'var(--lane3)',REVERSAL_RECOVERY:'var(--lane4)'};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = v => v==null ? '—' : (v>0?'+':v<0?'−':'') + Math.abs(Math.round(v)).toLocaleString('ko-KR') + '원';
const wonPlain = v => v==null ? '—' : Math.round(v).toLocaleString('ko-KR') + '원';
const pct = (v,d=2) => v==null ? '—' : (v>0?'+':v<0?'−':'') + Math.abs(v).toFixed(d) + '%';
const pctPlain = (v,d=1) => v==null ? '—' : v.toFixed(d) + '%';
const n = v => v==null ? '—' : Number(v).toLocaleString('ko-KR');
const cls = v => v>0?'gain':v<0?'loss':'';
const hold = s => s==null?'—': s>=3600? Math.floor(s/3600)+'시간 '+Math.floor(s%3600/60)+'분' : Math.floor(s/60)+'분 '+(s%60)+'초';
const ymd = d => d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
const md = d => d.slice(4,6)+'-'+d.slice(6,8);
const dow = d => ['일','월','화','수','목','금','토'][new Date(ymd(d)).getDay()];
// 주 = 월~금. 키는 그 주 월요일(yyyy-mm-dd). 휴장일은 집계본이 없으니 저절로 빠지고 남은 거래일만 그 주로 묶인다.
function isoWeekKey(d){ const dt=new Date(ymd(d)+'T00:00:00'); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function weekRange(key){ const a=new Date(key+'T00:00:00'); const b=new Date(a); b.setDate(a.getDate()+4); const f=x=>String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); return f(a)+'~'+f(b); }
// 운영자금 — 하루에 굴리는 돈(일일매수금액한도). 순손익을 이것으로 나눈 것이 «운영자금 대비 %», 그날 실제 매수금 합으로 나눈 것이 «매수금 대비 %».
const CAPITAL_KEY='tstudio-viewer-capital';
let CAPITAL = (()=>{ try{ const v=Number(localStorage.getItem(CAPITAL_KEY)); return v>0?v:15000000; }catch(e){ return 15000000; } })();
const pctOf=(net,base)=> base>0 ? net/base*100 : null;
function monthKey(d){ return d.slice(0,4)+'-'+d.slice(4,6); }

// ── 사람·계좌 묶음 ─────────────────────────────────────────────────────────────
const groups = [];
{
  const map = new Map();
  for (const d of DATA.days){
    const key = d.person+'|'+(d.scope||'?');
    if(!map.has(key)) map.set(key,{key,person:d.person,scope:d.scope,days:[]});
    map.get(key).days.push(d);
  }
  for (const g of map.values()){ g.days.sort((a,b)=>a.day<b.day?-1:1); g.first=g.days[0].day; g.last=g.days[g.days.length-1].day; groups.push(g); }
  groups.sort((a,b)=> (a.person==='나'?0:1)-(b.person==='나'?0:1) || (a.last<b.last?1:-1));
}
const state = { scope: groups.length?groups[0].key:null, range:'all', tab:'daily', day:null };
try{ const s=JSON.parse(localStorage.getItem('tstudio-viewer')||'{}'); if(groups.some(g=>g.key===s.scope)) Object.assign(state,s); }catch(e){}
// 주소 끝 #20260915 로 열면 그날을 바로 펼친다(링크로 나눌 수 있게).
{ const m=/^#(\d{8})$/.exec(location.hash||''); if(m){ const g=groups.find(x=>x.days.some(d=>d.day===m[1])); if(g){ state.scope=g.key; state.day=m[1]; state.tab='daily'; state.range='all'; } }
  else if(/^#(weekly|monthly|daily)$/.test(location.hash||'')){ state.tab=location.hash.slice(1); state.day=null; } }
function save(){ try{ localStorage.setItem('tstudio-viewer', JSON.stringify(state)); }catch(e){} try{ history.replaceState(null,'', state.day? '#'+state.day : '#'+state.tab); }catch(e){} }

function groupDays(){
  const g = groups.find(x=>x.key===state.scope); if(!g) return [];
  let days = g.days;
  if(state.range==='7'||state.range==='30'){ days = days.slice(-Number(state.range)); }
  else if(state.range==='month'){ const m = monthKey(g.last); days = days.filter(d=>monthKey(d.day)===m); }
  return days;
}
function sum(days){
  const o={trades:0,wins:0,losses:0,flats:0,net:0,cost:0,buy:0,days:days.length,best:null,worst:null,byLane:{},bySell:{}};
  for(const d of days){
    const c=d.counts||{}, m=d.money||{};
    o.trades+=c.trades||0; o.wins+=c.wins||0; o.losses+=c.losses||0; o.flats+=c.flats||0; o.net+=m.net||0;
    for(const r of d.rows||[]){ o.cost+=r.cost||0; o.buy+=r.buyAmount||0; const l=o.byLane[r.lane]||(o.byLane[r.lane]={trades:0,wins:0,net:0}); l.trades++; if((r.net||0)>0) l.wins++; l.net+=r.net||0;
      const s=o.bySell[r.sellReason||'—']||(o.bySell[r.sellReason||'—']={trades:0,wins:0,net:0}); s.trades++; if((r.net||0)>0) s.wins++; s.net+=r.net||0; }
    if(o.best==null||(m.net||0)>o.best.net) o.best={day:d.day,net:m.net||0};
    if(o.worst==null||(m.net||0)<o.worst.net) o.worst={day:d.day,net:m.net||0};
  }
  o.winRate = o.trades? o.wins/o.trades*100 : null;
  return o;
}

// ── 머리 컨트롤 ───────────────────────────────────────────────────────────────
function renderControls(){
  document.getElementById('controls').style.display='';
  if(DATA.since||DATA.until){ const m=$('#meta'); if(!m.dataset.range){ m.dataset.range='1'; m.textContent += ` · 담은 범위 ${DATA.since?ymd(DATA.since):'처음'}~${DATA.until?ymd(DATA.until):'마지막 집계본'}`; } }
  const sel=$('#scope'); sel.innerHTML = groups.map(g=>`<option value="${esc(g.key)}"${g.key===state.scope?' selected':''}>${esc(g.person)} · ${md(g.first)}~${md(g.last)} · ${g.days.length}일 · ${esc((g.scope||'').slice(0,12))}</option>`).join('');
  sel.onchange = e => { state.scope=e.target.value; state.day=null; save(); render(); };
  const ranges=[['all','전체'],['30','최근 30일'],['7','최근 7일'],['month','이달']];
  $('#range').innerHTML = ranges.map(([k,l])=>`<button data-k="${k}" class="${state.range===k?'on':''}">${l}</button>`).join('');
  $('#range').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.range=b.dataset.k; save(); render();});
  const tabs=[['daily','일별'],['weekly','주별'],['monthly','월별']];
  $('#tab').innerHTML = tabs.map(([k,l])=>`<button data-k="${k}" class="${state.tab===k?'on':''}">${l}</button>`).join('');
  $('#tab').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.k; save(); render();});
  const cap=$('#capital'); cap.value=Math.round(CAPITAL).toLocaleString('ko-KR');
  cap.onchange=()=>{ const v=Number(String(cap.value).replace(/[^0-9]/g,'')); if(v>0){ CAPITAL=v; try{ localStorage.setItem(CAPITAL_KEY,String(v)); }catch(e){} } render(); };
}

// ── 타일 ─────────────────────────────────────────────────────────────────────
function renderTiles(days){
  const o=sum(days);
  const tiles=[
    ['순손익 합', `<span class="${cls(o.net)}">${won(o.net)}</span>`, `${o.days}거래일 · 비용 ${wonPlain(o.cost)}`],
    ['운영자금 대비', `<span class="${cls(o.net)}">${pct(pctOf(o.net,CAPITAL))}</span>`, `운영자금 ${wonPlain(CAPITAL)} 기준`],
    ['매수금 대비', `<span class="${cls(o.net)}">${pct(pctOf(o.net,o.buy))}</span>`, `매수금 합 ${wonPlain(o.buy)}`],
    ['거래일 평균', `<span class="${cls(o.net)}">${o.days?won(o.net/o.days):'—'}</span>`, o.days?`운영자금 대비 ${pct(pctOf(o.net/o.days,CAPITAL))}/일`:''],
    ['완결 거래', n(o.trades)+'건', `이익 ${o.wins} · 손실 ${o.losses}${o.flats?' · 무 '+o.flats:''}`],
    ['승률', o.winRate==null?'—':pctPlain(o.winRate), `거래 ${o.trades}건 기준`],
    ['최저 거래일', o.worst?`<span class="${cls(o.worst.net)}">${won(o.worst.net)}</span>`:'—', o.worst?md(o.worst.day)+' ('+dow(o.worst.day)+')':''],
  ];
  $('#tiles').innerHTML = tiles.map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
}

// ── 차트 ─────────────────────────────────────────────────────────────────────
function barChart(items, opt){
  // items: [{label, value, key}] · 양수 빨강(이익) · 음수 파랑(손실) — 한국 관행.
  const W=opt.width||900, H=opt.height||220, L=64, R=12, T=14, B=34, iw=W-L-R, ih=H-T-B;
  const vals=items.map(i=>i.value||0); let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn){mx=1;mn=-1;}
  const pad=(mx-mn)*0.08; mx+=pad; mn-=pad;
  const y=v=>T+(mx-v)/(mx-mn)*ih, y0=y(0);
  const slot=iw/Math.max(items.length,1), bw=Math.max(3,Math.min(28,slot-2));
  const ticks=niceTicks(mn,mx,4);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title)}">`;
  for(const t of ticks) s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${opt.fmtAxis(t)}</text>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--axis)" stroke-width="1"/>`;
  const every=Math.ceil(items.length/Math.max(1,Math.floor(iw/46)));
  items.forEach((it,i)=>{
    const v=it.value||0, x=L+i*slot+(slot-bw)/2, top=Math.min(y(v),y0), h=Math.max(1,Math.abs(y(v)-y0));
    const r=Math.min(4,bw/2);
    const path = v>=0 ? `M${x},${y0} V${top+r} a${r},${r} 0 0 1 ${r},-${r} H${x+bw-r} a${r},${r} 0 0 1 ${r},${r} V${y0} Z`
                      : `M${x},${y0} V${top+h-r} a${r},${r} 0 0 0 ${r},${r} H${x+bw-r} a${r},${r} 0 0 0 ${r},-${r} V${y0} Z`;
    s+=`<path d="${path}" fill="${v>=0?'var(--gain)':'var(--loss)'}" data-i="${i}"/>`;
    s+=`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}" class="hit" style="cursor:${opt.onPick?'pointer':'default'}"/>`;
    if(i%every===0) s+=`<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(it.label)}</text>`;
  });
  s+=`</svg><div class="tip"></div>`;
  return attach(s, items, opt);
}
function lineChart(items, opt){
  const W=opt.width||900, H=opt.height||220, L=64, R=12, T=14, B=34, iw=W-L-R, ih=H-T-B;
  const vals=items.map(i=>i.value||0); let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn){mx=1;mn=-1;}
  const pad=(mx-mn)*0.08; mx+=pad; mn-=pad;
  const y=v=>T+(mx-v)/(mx-mn)*ih, y0=y(0), slot=iw/Math.max(items.length,1), x=i=>L+i*slot+slot/2;
  const ticks=niceTicks(mn,mx,4);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title)}">`;
  for(const t of ticks) s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${opt.fmtAxis(t)}</text>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--axis)"/>`;
  const pts=items.map((it,i)=>`${x(i)},${y(it.value||0)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  const every=Math.ceil(items.length/Math.max(1,Math.floor(iw/46)));
  items.forEach((it,i)=>{
    s+=`<circle cx="${x(i)}" cy="${y(it.value||0)}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    s+=`<rect x="${L+i*slot}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}" class="hit" style="cursor:${opt.onPick?'pointer':'default'}"/>`;
    if(i%every===0) s+=`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(it.label)}</text>`;
  });
  s+=`</svg><div class="tip"></div>`;
  return attach(s, items, opt);
}
function niceTicks(mn,mx,count){
  const span=mx-mn, raw=span/count, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p, step=(m<1.5?1:m<3?2:m<7?5:10)*p;
  const out=[]; for(let v=Math.ceil(mn/step)*step; v<=mx; v+=step) out.push(Math.abs(v)<1e-9?0:v); return out;
}
function attach(svg, items, opt){
  const el=document.createElement('div'); el.className='chart'; el.innerHTML=svg;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mousemove',e=>{ const it=items[+r.dataset.i]; tip.style.display='block'; tip.innerHTML=opt.tip(it); const b=el.getBoundingClientRect(); tip.style.left=(e.clientX-b.left)+'px'; tip.style.top=(e.clientY-b.top)+'px'; });
    r.addEventListener('mouseleave',()=>tip.style.display='none');
    if(opt.onPick) r.addEventListener('click',()=>opt.onPick(items[+r.dataset.i]));
  });
  return el;
}
const axisWon = v => Math.abs(v)>=10000 ? (v/10000).toFixed(Math.abs(v)>=100000?0:1)+'만' : Math.round(v).toLocaleString('ko-KR');

// ── 본문 ─────────────────────────────────────────────────────────────────────
function render(){
  renderControls();
  const days=groupDays();
  renderTiles(days);
  const main=$('#main'); main.innerHTML='';
  if(!days.length){ main.innerHTML='<div class="card empty">이 범위에 집계본이 없다.</div>'; $('#day').innerHTML=''; return; }
  if(state.tab==='daily') renderDaily(days, main);
  else renderPeriod(days, main, state.tab==='weekly'?isoWeekKey:monthKey, state.tab==='weekly'?'주':'월');
  if(state.day && !days.some(d=>d.day===state.day)) state.day=null;
  renderDay(days.find(d=>d.day===state.day));
}

function renderPeriod(days, main, keyFn, unit){
  const map=new Map();
  for(const d of days){ const k=keyFn(d.day); if(!map.has(k)) map.set(k,[]); map.get(k).push(d); }
  const periods=[...map.entries()].map(([k,ds])=>({key:k,days:ds,o:sum(ds)}));
  const label=k=> unit==='주' ? weekRange(k) : k;
  const bars=periods.map(p=>({key:p.key,label:label(p.key),value:p.o.net,p}));
  const c=document.createElement('div'); c.className='card'; c.innerHTML=`<h2>${unit}별 순손익${unit==='주'?' <span class="small">(월~금 · 휴장일은 빠진다)</span>':''}</h2>`;
  c.appendChild(barChart(bars,{title:unit+'별 순손익',fmtAxis:axisWon,tip:it=>`${label(it.key)} · ${won(it.value)} · 운영자금 대비 ${pct(pctOf(it.value,CAPITAL))} · ${it.p.o.days}거래일 · ${it.p.o.trades}건`}));
  c.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:var(--gain)"></i>이익</span><span><i style="background:var(--loss)"></i>손실</span></div>');
  main.appendChild(c);
  const rows=[...periods].reverse().map(p=>{const o=p.o; const ll=LANE_ORDER.map(l=>{const v=o.byLane[l]; return v?`<span class="chip"><span class="lane" style="background:${LANE_COLOR[l]}"></span>${LANE_LABEL[l].slice(0,2)} <span class="${cls(v.net)}">${won(v.net)}</span></span>`:'';}).join('');
    return `<tr><td style="white-space:nowrap">${unit==='주'?weekRange(p.key)+' <span class="small">주</span>':p.key}</td><td class="num">${o.days}</td><td class="num">${o.trades}</td><td class="num">${o.wins} / ${o.losses}</td><td class="num">${o.winRate==null?'—':pctPlain(o.winRate)}</td><td class="num ${cls(o.net)}">${won(o.net)}</td><td class="num ${cls(o.net)}">${pct(pctOf(o.net,CAPITAL))}</td><td class="num">${wonPlain(o.buy)}<div class="small ${cls(o.net)}">${pct(pctOf(o.net,o.buy))}</div></td><td class="num">${o.days?won(o.net/o.days):'—'}</td><td class="num ${cls(o.worst&&o.worst.net)}">${o.worst?md(o.worst.day)+' '+won(o.worst.net):'—'}</td><td>${ll}</td></tr>`;}).join('');

    const f = document.getElementById('login');
    f.onsubmit = async e => {
      e.preventDefault(); const m = document.getElementById('loginmsg'); m.textContent = '확인 중…';
      try { saveAuth(await authApi('password', {email:document.getElementById('email').value.trim(), password:document.getElementById('pw').value})); await load(); }
      catch(err){ m.textContent = '로그인 실패 — ' + (err.message||err); }
    };
  }
  function userBar(me){
    const top = document.querySelector('.top');
    let bar = document.getElementById('userbar');
    if(!bar){ bar = document.createElement('div'); bar.id='userbar'; bar.className='bar'; bar.style.margin='0'; top.appendChild(bar); }
    bar.innerHTML = `<span class="small">${esc(me.email)}${me.isAdmin?' · 관리자':''}</span>${me.isAdmin?'<button id="adminbtn">허용 표…</button>':''}<button id="logout">로그아웃</button>`;
    document.getElementById('logout').onclick = () => { saveAuth(null); location.reload(); };
    if(me.isAdmin) document.getElementById('adminbtn').onclick = () => toggleAdmin();
  }
  async function toggleAdmin(){
    let box = document.getElementById('admin');
    if(box){ box.remove(); return; }
    box = document.createElement('div'); box.id='admin'; box.className='card';
    box.innerHTML = '<h2>허용 표 — 누구에게 누구 보고서를 보여주나</h2><div class="small">불러오는 중…</div>';
    document.getElementById('tiles').before(box);
    try {
      const a = await call('admin');
      const admins = new Set(a.admins||[]);
      const has = new Set((a.grants||[]).map(g=>g.viewerUserId+'|'+g.ownerUserId));
      const owners = a.owners||[];
      if(!owners.length){ box.innerHTML = '<h2>허용 표</h2><div class="empty">아직 올라온 보고서가 없다.</div>'; return; }
      const head = owners.map(o=>`<th class="num">${esc(o.email)}<div class="small">${esc(o.lastDay||'')}까지 ${o.days}일</div></th>`).join('');
      const rows = (a.users||[]).map(u=>{
        const cells = owners.map(o=>{
          const self = u.userId===o.userId, adm = admins.has(u.userId);
          const checked = self||adm||has.has(u.userId+'|'+o.userId);
          return `<td class="num"><input type="checkbox" data-v="${u.userId}" data-o="${o.userId}" ${checked?'checked':''} ${(self||adm)?'disabled':''} title="${self?'자기 것':adm?'관리자는 전부':''}"></td>`; }).join('');
        return `<tr><td>${esc(u.email)}<span class="small"> · ${esc(u.status)}${admins.has(u.userId)?' · 관리자':''}</span></td>${cells}</tr>`; }).join('');
      box.innerHTML = `<div class="dayhead"><h2>허용 표 — 행의 사용자에게 열의 보고서를 보여준다</h2><span class="small">자기 것·관리자는 늘 본다 · 체크는 바로 저장된다</span></div>
        <div class="tw"><table><tr><th>사용자 ↓ · 보고서 주인 →</th>${head}</tr>${rows}</table></div><div id="adminmsg" class="small" style="margin-top:6px;min-height:18px"></div>`;
      box.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = async () => {
        const m = document.getElementById('adminmsg'); cb.disabled = true;
        try { const r = await call('grant', {viewerUserId:cb.dataset.v, ownerUserId:cb.dataset.o, allow:cb.checked}); m.textContent = r.message||''; }
        catch(err){ cb.checked = !cb.checked; m.textContent = '실패 — ' + (err.message||err); }
        cb.disabled = false;
      });
    } catch(err){ box.innerHTML = '<h2>허용 표</h2><div class="empty">' + esc(err.message||err) + '</div>'; }
  }
  async function load(){
    main.innerHTML = '<div class="card empty">자료를 받는 중…</div>';
    try {
      const lst = await call('list');
      userBar(lst.me);
      const owners = lst.owners||[];
      if(!owners.length){ main.innerHTML = '<div class="card empty">볼 수 있는 보고서가 아직 없다. 관리자가 허용하거나 자료가 올라오면 보인다.</div>'; return; }
      const parts = await Promise.all(owners.map(o => call('data', {ownerUserId:o.userId}).then(r => ({o, d:r.data})).catch(err => ({o, err}))));
      let base = null; const days = []; const failed = [];
      for(const p of parts){
        if(p.err){ failed.push(p.o.email+' — '+(p.err.message||p.err)); continue; }
        if(!base) base = p.d;
        for(const d of (p.d.days||[])){ d.person = p.o.userId===lst.me.userId ? '나' : p.o.email.split('@')[0]; d.links = {report:null, journal:null}; days.push(d); }
      }
      if(!base){ main.innerHTML = '<div class="card empty">자료를 받지 못했다 — ' + esc(failed.join(' · ')) + '</div>'; return; }
      days.sort((a,b)=> a.day<b.day?-1 : a.day>b.day?1 : a.person<b.person?-1:1);
      const m = document.getElementById('meta'); if(m) m.textContent = m.textContent.replace('(서버 자료)', base.generatedAt||'') + (failed.length?' · 못 받음: '+failed.join(' · '):'');
      boot(Object.assign({}, base, {days}));
    } catch(err){
      if(err.auth) showLogin(err.message==='로그인이 필요하다'?'':err.message); else main.innerHTML = '<div class="card empty">' + esc(err.message||err) + '</div>';
    }
  }
  session().then(a => a ? load() : showLogin(''));
}

// ── 자료를 어디서 받나 ─────────────────────────────────────────────────────────
// 심은 JSON이 있으면(자체 포함 판) 그것을, 웹 판(SERVER)이면 로그인 뒤 함수에서, 그도 아니면(껍데기를 로컬 서버로) 옆의 viewer-data.json을 받는다.
// 화면 코드(boot)는 셋 다 같다.
(function(){
  const el=document.getElementById('data'), text=(el&&el.textContent||'').trim();
  if(text){ boot(JSON.parse(text)); return; }
  if(SERVER && SERVER.url){ serverMode(); return; }
  const url=(document.querySelector('meta[name="viewer-data"]')||{}).content||'viewer-data.json';
  fetch(url,{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{ const m=document.getElementById('meta'); if(m) m.textContent=m.textContent.replace('(서버 자료)', d.generatedAt||''); boot(d); })
    .catch(e=>{ document.getElementById('main').innerHTML='<div class="card empty">자료를 받지 못했다 — '+String(e.message||e).replace(/</g,'&lt;')+'<br>이 껍데기는 서버(또는 localhost)에서 열어야 한다. 파일로 열려면 자체 포함 판 viewer.html을 쓴다.</div>'; });
})();
</script>
